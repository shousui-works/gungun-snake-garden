name: Game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test gameplay and input
        run: npm test
      - name: Check scripts and build standalone HTML
        run: npm run build
